name: Vercel Deploy

# Manual only for now: this repo has no VERCEL_TOKEN secret set (needs repo admin
# to add one, see comment below), so the old push/pull_request triggers just failed
# on every merge and PR. Re-add those triggers once the secret exists.
# Requires one repo secret: VERCEL_TOKEN (Vercel → Account → Tokens).
# The org/project IDs below are not secret (they identify the project, not credentials).
on:
  workflow_dispatch: {}

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_7qyP3L6F1XLBz5nMiLhA5tAy
  VERCEL_PROJECT_ID: prj_zoLyMydZVVjoiqsPAMTzLdUZoAYI

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the preview URL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `▲ **Vercel preview deployed:** ${{ steps.deploy.outputs.url }}`,
            });
